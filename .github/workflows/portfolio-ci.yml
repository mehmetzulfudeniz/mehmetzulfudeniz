name: Portfolio CI

on:
  push:
    branches: [main]
    paths:
      - "portfolio-projects/**"
      - ".github/workflows/portfolio-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "portfolio-projects/**"
      - ".github/workflows/portfolio-ci.yml"

jobs:
  python-toolkit:
    name: Python diagnostic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: portfolio-projects/support-diagnostic-toolkit
        run: python -m unittest -v

  cash-technology-lab:
    name: Cash technology lab tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cash technology tests
        working-directory: portfolio-projects/cash-technology-lab
        run: python -m unittest discover -s tests -v
      - name: Run deterministic cash-processing demo
        working-directory: portfolio-projects/cash-technology-lab
        run: python cli.py --profile bps-c1 --count 50 --seed 42 --mode fitness --audit /tmp/cash-audit.jsonl

  support-portal:
    name: .NET support portal build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore portfolio-projects/support-portal/SupportPortal.csproj
      - name: Build
        run: dotnet build portfolio-projects/support-portal/SupportPortal.csproj --configuration Release --no-restore

  cash-center-api:
    name: .NET cash center API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore portfolio-projects/cash-center-operations-api/CashCenterOperations.csproj
      - name: Build
        run: dotnet build portfolio-projects/cash-center-operations-api/CashCenterOperations.csproj --configuration Release --no-restore

  android-support-app:
    name: Android support app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Build debug APK
        run: gradle -p portfolio-projects/android-support-app :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: support-health-debug-apk
          path: portfolio-projects/android-support-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
